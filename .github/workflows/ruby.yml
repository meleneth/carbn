name: Ruby core

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Check Ruby syntax
        run: find lib test examples -name "*.rb" -print0 | xargs -0 -n1 ruby -c
      - name: Test framework-independent reactive core
        run: ruby -Ilib test/core_test.rb
      - name: Verify independent consumer
        run: ruby examples/counter.rb
      - name: Build gem
        run: gem build carbn.gemspec
