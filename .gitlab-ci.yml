# Internal GitLab runner pipeline. No GitHub Actions.
stages:
  - verify

default:
  tags:
    - docker

ruby_core:
  stage: verify
  image: ruby:4.0.10-trixie
  script:
    - find lib test examples -name "*.rb" -print0 | xargs -0 -n1 ruby -c
    - ruby -Ilib test/core_test.rb
    - ruby examples/counter.rb
    - gem build carbn.gemspec

browser_workspace:
  stage: verify
  image: node:22-trixie
  script:
    - node --check browser/git-capability.js
    - node --check browser/workspace-history.js
    - node --check browser/working-tree.js
    - node --test test/workspace-history.test.mjs

ruby_types:
  stage: verify
  image: ruby:4.0.10-trixie
  script:
    - gem install bundler -v 4.0.20 --no-document
    - bundle _4.0.20_ install
    - bundle _4.0.20_ exec rbs validate
    - bundle _4.0.20_ exec steep check
    - gem build carbn.gemspec
    - ruby -rrubygems/package -e 'files = Gem::Package.new(Dir["carbn-*.gem"].fetch(0)).spec.files; abort "Carbn gem is missing RBS signatures" unless files.include?("sig/carbn/graph.rbs") && files.include?("sig/carbn/store.rbs")'
